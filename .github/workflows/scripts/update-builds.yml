name: Update builds
on:
  schedule:
    - cron: "0 6 * * *"   # daily, 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install requests
      - run: python scripts/update_builds.py
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
      - name: Commit changes
        run: |
          git config user.name "tftiq-bot"
          git config user.email "actions@users.noreply.github.com"
          git add builds.json
          git diff --cached --quiet || (git commit -m "Update builds data" && git push)
